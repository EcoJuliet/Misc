name: Deploy Pages

on:
  push:
    branches:
      - master
      - claude/gym-workout-app-tif2hz
      - claude/study-site-kgqgo5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build combined site
        run: |
          mkdir -p dist
          cp .github/pages/index.html dist/index.html
          cp -r treino dist/treino
          cp -r tantra-estudo dist/tantra-estudo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
