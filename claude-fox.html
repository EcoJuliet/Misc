<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - A Raposa Azul</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        canvas {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claude - A Raposa Azul</h1>
        <canvas id="foxCanvas" width="500" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('foxCanvas');
        const ctx = canvas.getContext('2d');

        // Chapéu de festa
        function drawPartyHat() {
            // Cone do chapéu
            ctx.beginPath();
            ctx.moveTo(250, 80);
            ctx.lineTo(180, 200);
            ctx.lineTo(320, 200);
            ctx.closePath();

            // Gradiente para o chapéu
            const hatGradient = ctx.createLinearGradient(180, 80, 320, 200);
            hatGradient.addColorStop(0, '#FF6B9D');
            hatGradient.addColorStop(0.5, '#FEC84D');
            hatGradient.addColorStop(1, '#4ECDC4');
            ctx.fillStyle = hatGradient;
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Listras no chapéu
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(220, 140);
            ctx.lineTo(200, 200);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(250, 100);
            ctx.lineTo(250, 200);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(280, 140);
            ctx.lineTo(300, 200);
            ctx.stroke();

            // Pompom no topo
            ctx.beginPath();
            ctx.arc(250, 80, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Base do chapéu
            ctx.beginPath();
            ctx.ellipse(250, 200, 70, 15, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FF6B9D';
            ctx.fill();
            ctx.stroke();
        }

        // Cabeça da raposa
        function drawHead() {
            // Cabeça principal
            ctx.beginPath();
            ctx.arc(250, 280, 80, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.strokeStyle = '#2E5C8A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Orelhas
            // Orelha esquerda
            ctx.beginPath();
            ctx.moveTo(200, 240);
            ctx.lineTo(170, 180);
            ctx.lineTo(220, 220);
            ctx.closePath();
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.stroke();

            // Interior orelha esquerda
            ctx.beginPath();
            ctx.moveTo(205, 235);
            ctx.lineTo(185, 195);
            ctx.lineTo(215, 225);
            ctx.closePath();
            ctx.fillStyle = '#FFE0E6';
            ctx.fill();

            // Orelha direita
            ctx.beginPath();
            ctx.moveTo(300, 240);
            ctx.lineTo(330, 180);
            ctx.lineTo(280, 220);
            ctx.closePath();
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.stroke();

            // Interior orelha direita
            ctx.beginPath();
            ctx.moveTo(295, 235);
            ctx.lineTo(315, 195);
            ctx.lineTo(285, 225);
            ctx.closePath();
            ctx.fillStyle = '#FFE0E6';
            ctx.fill();

            // Focinho
            ctx.beginPath();
            ctx.ellipse(250, 300, 45, 35, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.stroke();

            // Nariz
            ctx.beginPath();
            ctx.arc(250, 290, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();

            // Boca
            ctx.beginPath();
            ctx.arc(250, 295, 15, 0, Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Olhos
            // Olho esquerdo
            ctx.beginPath();
            ctx.arc(230, 270, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(232, 270, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();

            // Brilho no olho esquerdo
            ctx.beginPath();
            ctx.arc(229, 267, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Olho direito
            ctx.beginPath();
            ctx.arc(270, 270, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(272, 270, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#333';
            ctx.fill();

            // Brilho no olho direito
            ctx.beginPath();
            ctx.arc(269, 267, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        // Corpo
        function drawBody() {
            // Corpo principal
            ctx.beginPath();
            ctx.ellipse(250, 420, 70, 90, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.strokeStyle = '#2E5C8A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Barriga
            ctx.beginPath();
            ctx.ellipse(250, 430, 45, 60, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        // Braços
        function drawArms() {
            // Braço esquerdo
            ctx.beginPath();
            ctx.ellipse(190, 390, 20, 50, -0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.strokeStyle = '#2E5C8A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Braço direito
            ctx.beginPath();
            ctx.ellipse(310, 390, 20, 50, 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.stroke();
        }

        // Pernas
        function drawLegs() {
            // Perna esquerda
            ctx.beginPath();
            ctx.ellipse(220, 520, 25, 40, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.strokeStyle = '#2E5C8A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Pé esquerdo
            ctx.beginPath();
            ctx.ellipse(220, 555, 30, 15, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2E5C8A';
            ctx.fill();
            ctx.stroke();

            // Perna direita
            ctx.beginPath();
            ctx.ellipse(280, 520, 25, 40, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.stroke();

            // Pé direito
            ctx.beginPath();
            ctx.ellipse(280, 555, 30, 15, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2E5C8A';
            ctx.fill();
            ctx.stroke();
        }

        // Cauda
        function drawTail() {
            // Cauda fofa
            ctx.beginPath();
            ctx.moveTo(310, 450);
            ctx.quadraticCurveTo(380, 430, 390, 480);
            ctx.quadraticCurveTo(395, 510, 370, 520);
            ctx.quadraticCurveTo(340, 525, 320, 490);
            ctx.closePath();
            ctx.fillStyle = '#4A90E2';
            ctx.fill();
            ctx.strokeStyle = '#2E5C8A';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Ponta branca da cauda
            ctx.beginPath();
            ctx.arc(375, 505, 25, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.stroke();
        }

        // Desenhar Claude completo
        function drawClaude() {
            drawTail();
            drawLegs();
            drawBody();
            drawArms();
            drawHead();
            drawPartyHat();
        }

        // Renderizar
        drawClaude();
    </script>
</body>
</html>
